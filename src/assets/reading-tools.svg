<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" direction="ltr" fill="none" role="img" aria-labelledby="reading-art-title reading-art-desc" data-hero-art="">
  <title id="reading-art-title">Reading with OCR, transcription and translation</title>
  <desc id="reading-art-desc">An illustrated PDF page with a recognised text region, an audio waveform and an Arabic-to-English translation panel. This is a diagram, not a product screenshot.</desc>
  <defs>
    <pattern id="art-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0v28" stroke="#A9B6AB" stroke-opacity=".08"/></pattern>
    <filter id="art-shadow" x="-35%" y="-35%" width="170%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#000" flood-opacity=".14"/></filter>
  </defs>
  <style>
    [data-hero-art]{--art-desk:#EBE8E0;--art-edge:#CCC8BD;--art-label:#626A60;--art-guide:#8D9688}
    @media(prefers-color-scheme:dark){[data-hero-art]{--art-desk:#202124;--art-edge:#434A44;--art-label:#B4BDB1;--art-guide:#899883}}
    [data-theme="light"] [data-hero-art]{--art-desk:#EBE8E0;--art-edge:#CCC8BD;--art-label:#626A60;--art-guide:#8D9688}
    [data-theme="dark"] [data-hero-art]{--art-desk:#202124;--art-edge:#434A44;--art-label:#B4BDB1;--art-guide:#899883}
    .art-text{font-family:system-ui,-apple-system,sans-serif}
    html[lang="ar"] .art-text,svg[lang="ar"] .art-text{letter-spacing:0}
    @keyframes art-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes art-scan{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(83px);opacity:.9}}
    @keyframes art-wave{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(1)}}
    @keyframes art-dash{to{stroke-dashoffset:-36}}
    @media(prefers-reduced-motion:no-preference){
      .motion-ready .art-float{animation:art-float 6s ease-in-out infinite}
      .motion-ready .art-float-late{animation:art-float 7s ease-in-out -2s infinite}
      .motion-ready .art-scan{animation:art-scan 4.5s ease-in-out infinite}
      .motion-ready .art-wave{transform-box:fill-box;transform-origin:center;animation:art-wave 1.4s ease-in-out infinite alternate}
      .motion-ready .art-wave:nth-child(2n){animation-delay:-.7s}
      .motion-ready .art-wave:nth-child(3n){animation-delay:-.3s}
      .motion-ready .art-flow{animation:art-dash 5s linear infinite}
    }
    [data-motion="paused"] [data-hero-art] *{animation-play-state:paused!important}
  </style>
  <circle cx="411" cy="344" r="294" stroke="var(--art-guide)" stroke-opacity=".18"/>
  <path d="M122 209a315 315 0 0 1 554-45M710 443a315 315 0 0 1-450 179" stroke="var(--art-guide)" stroke-opacity=".22" stroke-dasharray="2 10" stroke-linecap="round"/>
