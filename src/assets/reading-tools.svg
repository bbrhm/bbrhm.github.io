    <circle cx="470" cy="502" r="5" fill="#A27C51"/>
    <text class="art-text" x="598" y="508" text-anchor="middle" fill="#594C3D" font-size="16">Arabic → English</text>
    <path d="M466 539h140m16 0h81m-237 19h209m-209 19h103m16 0h88" stroke="#A79E8F" stroke-width="5" stroke-linecap="round"/>
    <text class="art-text" x="586" y="606" text-anchor="middle" fill="#776C5C" font-size="11" letter-spacing="1.7">PASSAGE TRANSLATION</text>
  </g>
  <circle cx="684" cy="239" r="7" fill="#C5A17B"/><path d="M139 610h18m-9-9v18M646 62h14m-7-7v14" stroke="#A7AD9F" stroke-width="1.5" stroke-linecap="round"/>
</svg>
