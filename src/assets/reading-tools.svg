  <rect x="102" y="100" width="604" height="475" rx="30" fill="var(--art-desk)" stroke="var(--art-edge)"/>
  <rect x="103" y="101" width="602" height="473" rx="29" fill="url(#art-grid)"/>
  <path d="M128 129h10c5 0 8 1 11 3 3-2 6-3 11-3h10v25h-10c-5 0-8 1-11 3-3-2-6-3-11-3h-10zm21 3v25" stroke="var(--art-label)" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M129 542h47m-47-9h25" stroke="var(--art-guide)" stroke-width="1.5" opacity=".5"/>
  <path class="art-flow" d="M140 283H84v189h125m401-130h105v213h-99" stroke="#C9AF88" stroke-opacity=".65" stroke-dasharray="4 8" stroke-width="1.5"/>
